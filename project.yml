name: DailyNutritionTracker
options:
  bundleIdPrefix: com.dailynutrition
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  DailyNutritionTracker:
    type: application
    platform: iOS
    sources:
      - DailyNutritionTracker
    dependencies:
      - sdk: HealthKit.framework
      - sdk: Charts.framework
    scheme:
      testTargets: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dailynutrition.tracker
        PRODUCT_DISPLAY_NAME: Daily On Plan
        INFOPLIST_FILE: DailyNutritionTracker/Info.plist
        CODE_SIGN_ENTITLEMENTS: DailyNutritionTracker/DailyNutritionTracker.entitlements
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: DailyNutritionTracker/DailyNutritionTracker.entitlements
