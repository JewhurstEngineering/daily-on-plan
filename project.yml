name: DailyNutritionTracker
options:
  bundleIdPrefix: com.dailyonplan
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 6998422DKP
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"

# Keep companion under Watch/ so the iPhone Watch app can discover it.
# Install to Watch by running the Watch scheme (not Available Apps alone).
schemes:
  DailyNutritionTracker:
    build:
      targets:
        DailyNutritionTracker: all
        DailyNutritionTrackerWidgets: all
        DailyNutritionTrackerWatch: all
        DailyNutritionTrackerWatchWidgets: all
    run:
      config: Debug
      executable: DailyNutritionTracker
  DailyNutritionTrackerWatch:
    build:
      targets:
        DailyNutritionTrackerWatch: all
        DailyNutritionTracker: all
        DailyNutritionTrackerWatchWidgets: all
    run:
      config: Debug
      executable: DailyNutritionTrackerWatch
    profile:
      config: Release
      executable: DailyNutritionTrackerWatch

targets:
  DailyNutritionTracker:
    type: application
    platform: iOS
    sources:
      - path: DailyNutritionTracker
        excludes:
          - "**/*.entitlements"
      - path: DailyNutritionTrackerWidgets/Shared
      - path: SharedWatch
    dependencies:
      - target: DailyNutritionTrackerWidgets
      - target: DailyNutritionTrackerWatch
        embed: true
      - sdk: HealthKit.framework
      - sdk: Charts.framework
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
      - sdk: WatchConnectivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dailyonplan.tracker
        PRODUCT_DISPLAY_NAME: Daily On Plan
        INFOPLIST_FILE: DailyNutritionTracker/Info.plist
        CODE_SIGN_ENTITLEMENTS: DailyNutritionTracker/DailyNutritionTracker.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: DailyNutritionTracker/DailyNutritionTracker.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.com.dailyonplan.tracker

  DailyNutritionTrackerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DailyNutritionTrackerWidgets
        excludes:
          - "Info.plist"
          - "**/*.entitlements"
      - path: DailyNutritionTracker/Models/Models.swift
      - path: DailyNutritionTracker/Models/Enums.swift
      - path: DailyNutritionTracker/Models/AccentTheme.swift
      - path: DailyNutritionTracker/Utilities/OnPlanColors.swift
      - path: DailyNutritionTracker/Utilities/AppLimits.swift
      - path: DailyNutritionTracker/Services/DataStore.swift
      - path: SharedWatch
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dailyonplan.tracker.widgets
        PRODUCT_DISPLAY_NAME: Daily On Plan Widgets
        INFOPLIST_FILE: DailyNutritionTrackerWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: DailyNutritionTrackerWidgets/DailyNutritionTrackerWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        SKIP_INSTALL: true
    entitlements:
      path: DailyNutritionTrackerWidgets/DailyNutritionTrackerWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dailyonplan.tracker

  DailyNutritionTrackerWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: DailyNutritionTrackerWatch
        excludes:
          - "Info.plist"
          - "**/*.entitlements"
      - path: SharedWatch
    dependencies:
      - target: DailyNutritionTrackerWatchWidgets
        embed: true
      - sdk: WatchConnectivity.framework
      - sdk: WidgetKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dailyonplan.tracker.watchkitapp
        PRODUCT_DISPLAY_NAME: Daily On Plan
        INFOPLIST_FILE: DailyNutritionTrackerWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: DailyNutritionTrackerWatch/DailyNutritionTrackerWatch.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        # Prevent inheriting the iOS 17 deployment target from project-level settings
        # (Xcode can mis-report that as a watchOS mismatch).
        IPHONEOS_DEPLOYMENT_TARGET: ""
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: DailyNutritionTrackerWatch/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.dailyonplan.tracker
        WKRunsIndependentlyOfCompanionApp: false
        CFBundleDisplayName: Daily On Plan
    entitlements:
      path: DailyNutritionTrackerWatch/DailyNutritionTrackerWatch.entitlements

  DailyNutritionTrackerWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: DailyNutritionTrackerWatchWidgets
        excludes:
          - "Info.plist"
          - "**/*.entitlements"
      - path: SharedWatch
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dailyonplan.tracker.watchkitapp.widgets
        PRODUCT_DISPLAY_NAME: Daily On Plan
        INFOPLIST_FILE: DailyNutritionTrackerWatchWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: DailyNutritionTrackerWatchWidgets/DailyNutritionTrackerWatchWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        IPHONEOS_DEPLOYMENT_TARGET: ""
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    entitlements:
      path: DailyNutritionTrackerWatchWidgets/DailyNutritionTrackerWatchWidgets.entitlements
